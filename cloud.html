<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Config Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0b1020;
      color: #fff;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 230px;
      background: #11182b;
      border-right: 1px solid #202a42;
      padding: 20px 14px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      padding: 10px 12px 25px;
    }

    .nav-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #aab4cc;
      padding: 13px 14px;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .nav-button:hover,
    .nav-button.active {
      background: #1d2944;
      color: #fff;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 35px;
      max-width: 1100px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #8994ad;
      margin-top: 7px;
    }

    .add-button {
      border: 0;
      background: #5865f2;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .add-button:hover {
      background: #4752c4;
    }

    /* Config list */
    .config-list {
      display: grid;
      gap: 12px;
    }

    .config-card {
      background: #11182b;
      border: 1px solid #202a42;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-name {
      font-size: 16px;
      font-weight: 600;
    }

    .config-meta {
      margin-top: 6px;
      color: #7f8ba5;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      margin-left: 8px;
      color: #4ade80;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action-button {
      border: 1px solid #303c58;
      background: #182138;
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .action-button:hover {
      background: #24304d;
    }

    .delete:hover {
      background: #4c2027;
      color: #ff8d9a;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: #11182b;
      border: 1px solid #293550;
      border-radius: 14px;
      padding: 25px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      color: #aab4cc;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #0b1020;
      border: 1px solid #303c58;
      color: white;
      border-radius: 8px;
      padding: 11px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #5865f2;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .cancel {
      background: #202a42;
    }

    .empty {
      padding: 50px;
      text-align: center;
      color: #7f8ba5;
      border: 1px dashed #303c58;
      border-radius: 12px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
      }

      .logo {
        font-size: 0;
      }

      .logo::after {
        content: "☁️";
        font-size: 22px;
      }

      .nav-button {
        font-size: 0;
        text-align: center;
      }

      .nav-button::first-letter {
        font-size: 20px;
      }

      .main {
        padding: 20px;
      }

      .page-header {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
      }

      .config-card {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">My App</div>

      <button class="nav-button">🏠 Home</button>
      <button class="nav-button active">☁️ Cloud</button>
      <button class="nav-button">⚙️ Settings</button>
    </aside>

    <!-- Main content -->
    <main class="main">

      <div class="page-header">
        <div>
          <h1>☁️ Cloud</h1>
          <div class="subtitle">
            Manage your application configurations.
          </div>
        </div>

        <button class="add-button" onclick="openModal()">
          + Add Config
        </button>
      </div>

      <div id="configList" class="config-list"></div>

    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal" class="modal">
    <div class="modal-box">

      <h2 id="modalTitle">Add Config</h2>

      <label for="configName">Config Name</label>
      <input
        id="configName"
        type="text"
        placeholder="API Settings"
      />

      <label for="environment">Environment</label>
      <select id="environment">
        <option>Development</option>
        <option>Staging</option>
        <option>Production</option>
      </select>

      <label for="configValue">Configuration</label>
      <textarea
        id="configValue"
        placeholder='{"apiUrl":"https://example.com","debug":true}'
      ></textarea>

      <div class="modal-actions">
        <button
          class="action-button cancel"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="add-button"
          onclick="saveConfig()"
        >
          Save Config
        </button>
      </div>

    </div>
  </div>

  <script>
    let configs = JSON.parse(
      localStorage.getItem("cloudConfigs") || "[]"
    );

    let editingIndex = -1;

    function renderConfigs() {
      const list = document.getElementById("configList");

      if (configs.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div style="font-size: 35px;">☁️</div>
            <h3>No configs yet</h3>
            <p>Click "Add Config" to create your first configuration.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = configs.map((config, index) => `
        <div class="config-card">

          <div>
            <div class="config-name">
              ${escapeHtml(config.name)}
            </div>

            <div class="config-meta">
              ${escapeHtml(config.environment)}
              <span class="status">● Active</span>
            </div>
          </div>

          <div class="actions">
            <button
              class="action-button"
              onclick="editConfig(${index})"
            >
              Edit
            </button>

            <button
              class="action-button delete"
              onclick="deleteConfig(${index})"
            >
              Delete
            </button>
          </div>

        </div>
      `).join("");
    }

    function openModal(index = -1) {
      editingIndex = index;

      document.getElementById("modal").classList.add("open");

      if (index === -1) {
        document.getElementById("modalTitle").textContent =
          "Add Config";

        document.getElementById("configName").value = "";
        document.getElementById("environment").value =
          "Development";

        document.getElementById("configValue").value = "";
      } else {
        const config = configs[index];

        document.getElementById("modalTitle").textContent =
          "Edit Config";

        document.getElementById("configName").value =
          config.name;

        document.getElementById("environment").value =
          config.environment;

        document.getElementById("configValue").value =
          config.value;
      }
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
      editingIndex = -1;
    }

    function saveConfig() {
      const name =
        document.getElementById("configName").value.trim();

      const environment =
        document.getElementById("environment").value;

      const value =
        document.getElementById("configValue").value.trim();

      if (!name) {
        alert("Please enter a config name.");
        return;
      }

      const config = {
        name,
        environment,
        value
      };

      if (editingIndex === -1) {
        configs.push(config);
      } else {
        configs[editingIndex] = config;
      }

      localStorage.setItem(
        "cloudConfigs",
        JSON.stringify(configs)
      );

      closeModal();
      renderConfigs();
    }

    function editConfig(index) {
      openModal(index);
    }

    function deleteConfig(index) {
      if (
        confirm(
          `Delete "${configs[index].name}"?`
        )
      ) {
        configs.splice(index, 1);

        localStorage.setItem(
          "cloudConfigs",
          JSON.stringify(configs)
        );

        renderConfigs();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Close modal when clicking outside it
    document
      .getElementById("modal")
      .addEventListener("click", function (event) {
        if (event.target === this) {
          closeModal();
        }
      });

    renderConfigs();
  </script>

</body>
</html>
